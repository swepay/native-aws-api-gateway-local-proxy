# ═══════════════════════════════════════════════════════════════════════════════
# GitHub Actions - CI (Continuous Integration)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Executa em todo push e PR:
#   - Lint (golangci-lint)
#   - Testes
#   - Build para múltiplas plataformas
#   - Security scan
#
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
    push:
        branches:
            - main
            - develop
            - "feature/**"
            - "fix/**"
    pull_request:
        branches:
            - main
            - develop

jobs:
    # ─────────────────────────────────────────────────────────────────────────────
    # Job: Lint
    # ─────────────────────────────────────────────────────────────────────────────
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.21"
                  cache: true

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v4
              with:
                  version: latest
                  args: --timeout=5m

    # ─────────────────────────────────────────────────────────────────────────────
    # Job: Test
    # ─────────────────────────────────────────────────────────────────────────────
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.21"
                  cache: true

            - name: Run tests
              run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

            - name: Run benchmarks
              run: go test -bench=. -benchmem -run=^$ ./...

            - name: Upload coverage
              uses: codecov/codecov-action@v4
              with:
                  files: ./coverage.txt
                  fail_ci_if_error: false
              continue-on-error: true

    # ─────────────────────────────────────────────────────────────────────────────
    # Job: Build
    # ─────────────────────────────────────────────────────────────────────────────
    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, test]

        strategy:
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                      suffix: linux-amd64
                    - goos: linux
                      goarch: arm64
                      suffix: linux-arm64
                    - goos: darwin
                      goarch: amd64
                      suffix: darwin-amd64
                    - goos: darwin
                      goarch: arm64
                      suffix: darwin-arm64
                    - goos: windows
                      goarch: amd64
                      suffix: windows-amd64.exe

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.21"
                  cache: true

            - name: Build binary
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: 0
              run: |
                  go build -ldflags="-w -s -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
                    -o proxy-${{ matrix.suffix }} \
                    .

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: proxy-${{ matrix.suffix }}
                  path: proxy-${{ matrix.suffix }}
                  retention-days: 7

    # ─────────────────────────────────────────────────────────────────────────────
    # Job: Security Scan
    # ─────────────────────────────────────────────────────────────────────────────
    security:
        name: Security Scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Gosec Security Scanner
              uses: securego/gosec@master
              with:
                  args: ./...
              continue-on-error: true

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  format: "sarif"
                  output: "trivy-results.sarif"
              continue-on-error: true

            - name: Upload Trivy scan results
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: "trivy-results.sarif"
              continue-on-error: true
